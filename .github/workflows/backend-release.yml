name: Publish backend release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/frontend-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: backend-release
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Detect backend paths
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths=$(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA")
          backend=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              web/*|docs/*|*.md|.github/workflows/frontend-release.yml) ;;
              *) backend=true; break ;;
            esac
          done <<< "$changed_paths"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign, and publish backend
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve release identity
        shell: bash
        run: |
          BUILD_VERSION=$(tr -d '\r\n[:space:]' < VERSION | sed -E 's/[^A-Za-z0-9._+-]+/-/g')
          BUILD_VERSION=${BUILD_VERSION:0:128}
          if [[ ! "$BUILD_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]]; then
            echo "::error::Unable to derive a valid backend version"
            exit 1
          fi
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Wait for matching frontend release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet "${{ github.event.before }}" "$GITHUB_SHA" -- web; then
            exit 0
          fi
          for attempt in {1..60}; do
            result=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow frontend-release.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | select(.status == "completed") | .conclusion' 2>/dev/null || true)
            if [[ "$result" == "success" ]]; then
              exit 0
            fi
            if [[ -n "$result" ]]; then
              echo "::error::Matching frontend release failed: $result"
              exit 1
            fi
            sleep 10
          done
          echo '::error::Timed out waiting for the matching frontend release'
          exit 1

      - name: Download embedded frontend fallback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p web/dist
          gh release download latestFront \
            --repo "$GITHUB_REPOSITORY" \
            --pattern frontend-latest.tar.gz \
            --clobber
          tar -xzf frontend-latest.tar.gz -C web/dist
          test -f web/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'

      - name: Derive trusted public key
        env:
          BACKEND_UPDATE_SIGNING_KEY: ${{ secrets.BACKEND_UPDATE_SIGNING_KEY }}
        run: |
          BACKEND_PUBLIC_KEY=$(go run ./cmd/backend-release-sign public-key)
          if [[ "$BACKEND_PUBLIC_KEY" != '8DxuvAeXP2JBMlFhIk1LKwItiAVygCCDe8sCMMeBTDU=' ]]; then
            echo '::error::Backend signing key does not match the trusted updater key'
            exit 1
          fi

      - name: Build Linux backends
        env:
          CGO_ENABLED: '0'
          GOEXPERIMENT: greenteagc
        run: |
          go mod download
          LDFLAGS="-s -w -X github.com/QuantumNous/new-api/common.Version=$BUILD_VERSION -X github.com/QuantumNous/new-api/common.BuildVersion=$BUILD_VERSION -X github.com/QuantumNous/new-api/common.BuildCommit=$BUILD_COMMIT"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o new-api-linux-amd64
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o new-api-linux-arm64
          if [ "$(./new-api-linux-amd64 --version)" != "$BUILD_VERSION" ]; then
            echo "::error::Built backend version does not match the release manifest"
            exit 1
          fi

      - name: Generate signed manifest
        env:
          BACKEND_UPDATE_SIGNING_KEY: ${{ secrets.BACKEND_UPDATE_SIGNING_KEY }}
        run: |
          AMD64_SHA256=$(sha256sum new-api-linux-amd64 | cut -d ' ' -f 1)
          ARM64_SHA256=$(sha256sum new-api-linux-arm64 | cut -d ' ' -f 1)
          AMD64_SIZE=$(stat -c '%s' new-api-linux-amd64)
          ARM64_SIZE=$(stat -c '%s' new-api-linux-arm64)
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg version "$BUILD_VERSION" \
            --arg commit "$BUILD_COMMIT" \
            --arg published_at "$PUBLISHED_AT" \
            --arg amd64_sha256 "$AMD64_SHA256" \
            --arg arm64_sha256 "$ARM64_SHA256" \
            --argjson amd64_size "$AMD64_SIZE" \
            --argjson arm64_size "$ARM64_SIZE" \
            '{
              schema_version: 1,
              version: $version,
              commit: $commit,
              published_at: $published_at,
              artifacts: {
                "linux-amd64": {
                  os: "linux",
                  arch: "amd64",
                  url: "new-api-linux-amd64",
                  sha256: $amd64_sha256,
                  size: $amd64_size
                },
                "linux-arm64": {
                  os: "linux",
                  arch: "arm64",
                  url: "new-api-linux-arm64",
                  sha256: $arm64_sha256,
                  size: $arm64_size
                }
              }
            }' > backend-manifest.json
          go run ./cmd/backend-release-sign sign backend-manifest.json

      - name: Publish latest backend release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: latestBackend
          name: Latest backend
          target_commitish: ${{ github.sha }}
          files: |
            new-api-linux-amd64
            new-api-linux-arm64
            backend-manifest.json
            backend-manifest.json.sig
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 整条发布链路的通知汇总点：同一次发布只在这里发一条，
  # 其余 workflow 不再各自通知，避免一次发布刷屏。
  # needs 必须列出本 workflow 的全部发布 job，漏写只会让通知静默少一项。
  notify:
    name: Notify workflow result
    needs: [changes, release]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # 汇总正文只算一次，各渠道共用
      - name: Build result summary
        id: summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          needs = json.loads(os.environ["NEEDS_JSON"])
          results = [info.get("result", "unknown") for info in needs.values()]
          if "failure" in results:
              overall = "failure"
          elif "cancelled" in results:
              overall = "cancelled"
          else:
              overall = "success"

          lines = [
              f"[{os.environ['REPO']}] {os.environ['REF']} - {overall}",
              "",
              f"Repository: {os.environ['REPO']}",
              f"Ref: {os.environ['REF']}",
              f"Commit: {os.environ['SHA']}",
              "",
              "Jobs:",
          ]
          lines += [f"- {job}: {info.get('result', 'unknown')}" for job, info in needs.items()]

          print("text<<SUMMARY_EOF")
          print("\n".join(lines))
          print("SUMMARY_EOF")
          PY

      - name: Notify by Feishu
        env:
          FEISHU_WEB_HOOK: ${{ secrets.FEISHU_WEB_HOOK }}
          FEISHU_SIGN: ${{ secrets.FEISHU_SIGN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, sys, time, urllib.error, urllib.request

          timestamp = str(int(time.time()))
          string_to_sign = f"{timestamp}\n{os.environ['FEISHU_SIGN']}"
          sign = base64.b64encode(
              hmac.new(string_to_sign.encode(), b"", hashlib.sha256).digest()
          ).decode()

          request = urllib.request.Request(
              os.environ["FEISHU_WEB_HOOK"],
              data=json.dumps({
                  "timestamp": timestamp,
                  "sign": sign,
                  "msg_type": "text",
                  "content": {"text": os.environ["SUMMARY"]},
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status, body = response.status, response.read().decode()
          except urllib.error.HTTPError as error:
              status, body = error.code, error.read().decode()

          print(f"HTTP {status}: {body}")
          code = json.loads(body).get("code")
          if code != 0:
              sys.exit(f"Feishu notify failed: code={code}, body={body}")
          PY
