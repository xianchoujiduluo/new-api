name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          BUILD_COMMIT=$(git rev-parse HEAD)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "commit=${BUILD_COMMIT}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: dx95/new-api

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_COMMIT=${{ steps.version.outputs.commit }}
          push: true
          tags: |
            dx95/new-api:${{ env.TAG }}-${{ matrix.arch }}
            dx95/new-api:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes dx95/new-api@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "dx95/new-api:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write

    steps:
      - name: Set version
        run: echo "TAG=${{ needs.build_single_arch.outputs.tag }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            -t dx95/new-api:${TAG} \
            dx95/new-api:${TAG}-amd64 \
            dx95/new-api:${TAG}-arm64

      - name: Create & push manifest (latest)
        run: |
          docker buildx imagetools create \
            -t dx95/new-api:latest \
            dx95/new-api:latest-amd64 \
            dx95/new-api:latest-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes dx95/new-api:${TAG}
          cosign sign --yes dx95/new-api:latest

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect dx95/new-api:${TAG} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # 整条发布链路的通知汇总点：同一次发布只在这里发一条，
  # 其余 workflow 不再各自通知，避免一次发布刷屏。
  # needs 必须列出本 workflow 的全部发布 job，漏写只会让通知静默少一项。
  notify:
    name: Notify workflow result
    needs: [build_single_arch, create_manifests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # 汇总正文只算一次，各渠道共用
      - name: Build result summary
        id: summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          needs = json.loads(os.environ["NEEDS_JSON"])
          results = [info.get("result", "unknown") for info in needs.values()]
          if "failure" in results:
              overall = "failure"
          elif "cancelled" in results:
              overall = "cancelled"
          else:
              overall = "success"

          lines = [
              f"[{os.environ['REPO']}] {os.environ['REF']} - {overall}",
              "",
              f"Repository: {os.environ['REPO']}",
              f"Ref: {os.environ['REF']}",
              f"Commit: {os.environ['SHA']}",
              "",
              "Jobs:",
          ]
          lines += [f"- {job}: {info.get('result', 'unknown')}" for job, info in needs.items()]

          print("text<<SUMMARY_EOF")
          print("\n".join(lines))
          print("SUMMARY_EOF")
          PY

      - name: Notify by Feishu
        env:
          FEISHU_WEB_HOOK: ${{ secrets.FEISHU_WEB_HOOK }}
          FEISHU_SIGN: ${{ secrets.FEISHU_SIGN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, sys, time, urllib.error, urllib.request

          timestamp = str(int(time.time()))
          string_to_sign = f"{timestamp}\n{os.environ['FEISHU_SIGN']}"
          sign = base64.b64encode(
              hmac.new(string_to_sign.encode(), b"", hashlib.sha256).digest()
          ).decode()

          request = urllib.request.Request(
              os.environ["FEISHU_WEB_HOOK"],
              data=json.dumps({
                  "timestamp": timestamp,
                  "sign": sign,
                  "msg_type": "text",
                  "content": {"text": os.environ["SUMMARY"]},
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status, body = response.status, response.read().decode()
          except urllib.error.HTTPError as error:
              status, body = error.code, error.read().decode()

          print(f"HTTP {status}: {body}")
          code = json.loads(body).get("code")
          if code != 0:
              sys.exit(f"Feishu notify failed: code={code}, body={body}")
          PY
