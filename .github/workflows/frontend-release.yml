name: Publish frontend release

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/frontend-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        env:
          CI: ''
          DISABLE_ESLINT_PLUGIN: 'true'
        run: bun run build

      - name: Package frontend assets
        run: |
          cd dist
          shopt -s dotglob nullglob
          files=(*)
          if (( ${#files[@]} == 0 )); then
            echo 'Frontend build output is empty'
            exit 1
          fi
          tar -czf ../../frontend-latest.tar.gz -- "${files[@]}"

      - name: Publish latest frontend release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: latestFront
          name: Latest frontend
          target_commitish: ${{ github.sha }}
          files: frontend-latest.tar.gz
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Email workflow result
    needs: [release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send workflow result email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          subject: "[${{ github.repository }}] ${{ github.workflow }} result"
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Frontend release: ${{ needs.release.result }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
