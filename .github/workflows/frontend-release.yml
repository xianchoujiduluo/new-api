name: Publish frontend release

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/frontend-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        env:
          CI: ''
          DISABLE_ESLINT_PLUGIN: 'true'
        run: bun run build

      - name: Package frontend assets
        run: |
          cd dist
          shopt -s dotglob nullglob
          files=(*)
          if (( ${#files[@]} == 0 )); then
            echo 'Frontend build output is empty'
            exit 1
          fi
          tar -czf ../../frontend-latest.tar.gz -- "${files[@]}"

      - name: Publish latest frontend release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: latestFront
          name: Latest frontend
          target_commitish: ${{ github.sha }}
          files: frontend-latest.tar.gz
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 整条发布链路的通知汇总点：同一次发布只在这里发一条，
  # 其余 workflow 不再各自通知，避免一次发布刷屏。
  # needs 必须列出本 workflow 的全部发布 job，漏写只会让通知静默少一项。
  notify:
    name: Notify workflow result
    needs: [release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # 汇总正文只算一次，各渠道共用
      - name: Build result summary
        id: summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          needs = json.loads(os.environ["NEEDS_JSON"])
          results = [info.get("result", "unknown") for info in needs.values()]
          if "failure" in results:
              overall = "failure"
          elif "cancelled" in results:
              overall = "cancelled"
          else:
              overall = "success"

          lines = [
              f"[{os.environ['REPO']}] {os.environ['REF']} - {overall}",
              "",
              f"Repository: {os.environ['REPO']}",
              f"Ref: {os.environ['REF']}",
              f"Commit: {os.environ['SHA']}",
              "",
              "Jobs:",
          ]
          lines += [f"- {job}: {info.get('result', 'unknown')}" for job, info in needs.items()]

          print("text<<SUMMARY_EOF")
          print("\n".join(lines))
          print("SUMMARY_EOF")
          PY

      - name: Notify by Feishu
        env:
          FEISHU_WEB_HOOK: ${{ secrets.FEISHU_WEB_HOOK }}
          FEISHU_SIGN: ${{ secrets.FEISHU_SIGN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, sys, time, urllib.error, urllib.request

          timestamp = str(int(time.time()))
          string_to_sign = f"{timestamp}\n{os.environ['FEISHU_SIGN']}"
          sign = base64.b64encode(
              hmac.new(string_to_sign.encode(), b"", hashlib.sha256).digest()
          ).decode()

          request = urllib.request.Request(
              os.environ["FEISHU_WEB_HOOK"],
              data=json.dumps({
                  "timestamp": timestamp,
                  "sign": sign,
                  "msg_type": "text",
                  "content": {"text": os.environ["SUMMARY"]},
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status, body = response.status, response.read().decode()
          except urllib.error.HTTPError as error:
              status, body = error.code, error.read().decode()

          print(f"HTTP {status}: {body}")
          code = json.loads(body).get("code")
          if code != 0:
              sys.exit(f"Feishu notify failed: code={code}, body={body}")
          PY
